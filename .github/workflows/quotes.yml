# The live quote check (scripts/check-quotes.ts). It reads the source of each quote one time each week, through the page
# store of polite-crawler. It fails when the text of a source does not hold its quote. A source that it cannot read
# gives a warning, not a failure. The log gives the record of each quote that it found, with the new date `checked`.
name: Quotes

on:
  pull_request:
    paths:
      - "packages/preparedness/src/data/**"
      - "packages/guidebook/src/quote.ts"
      - "scripts/check-quotes.ts"
      - ".github/workflows/quotes.yml"
  schedule:
    - cron: "41 7 * * 4"
  workflow_dispatch:

permissions: {}

concurrency:
  group: quotes
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-quotes.ts
